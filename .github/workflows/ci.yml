name: CPU reproducibility contract
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Minimal CPU dependencies
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 pytest==8.4.2 transformers==4.57.1 omegaconf==2.3.0
      - name: Fetch and check exact public upstream
        env:
          PYTHONPATH: src
        run: python -m rethink_webshop.setup --framework --data --verify
      - name: CPU tests including actual upstream Teacher builder
        run: pytest -q
      - name: Publication privacy and historical blobs
        run: python scripts/check_release.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Native text-environment dependencies (no Actor or API)
        run: |
          pip install torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r configs/requirements-native-cpu.txt
      - name: Actual shared140 worker reset, search and feedback at seeds1000/1001/1139
        env:
          PYTHONPATH: src
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          _JAVA_OPTIONS: '-XX:+UseSerialGC -Xss512k -Xmx1g'
        run: |
          python -m rethink_webshop.assets --download --nlp --index --verify
          python scripts/smoke_native.py
